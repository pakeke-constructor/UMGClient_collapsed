# vvvvvvvvvvvv You should probably specify the following values vvvvvvvvvvvv

name = "umg"

love_files = [
    "::git-ls-tree::",
    "-./x_notes/*", # no notes!
    "-*/*.md", # no markdown files
    "-./build/*", # Dont include LOVE files
    "-*/.*", # .git, .github
    "-*/*.dll", 
    "-*/*.lib",# dlls/lib at root of project
]



# vvvvvvvvvvvv You may want to specify these too vvvvvvvvvvvv

# love_version = "12.0"


default_targets = ["win32", "win64", "appimage"] # 
# default_targets = ["win32", "win64"] # 



# By default this is "makelove-build"
build_directory = "build_output"


# TODO: Add an icon.
# icon_file = "icon.png"


keep_game_directory = false # remove temporary folders after building



# Files that are put next to executable.
[archive_files]
"assets/LICENSE.txt" = "LICENSE.txt"
"steam_appid.txt" = "steam_appid.txt" 



[hooks]
# I'm not really sure if we need hooks...?
# I think we should just have GH actions handle everything.
prebuild = [
	# "python3 ./generate_changelog.py",
	# "./generate_builddata.py",
]

postbuild = [
]





[windows]


[windows.exe_metadata]
FileDescription = "{name} {version}"
FileVersion = "{version}"
CompanyName = "CodeTheory Ltd"
LegalCopyright = "Copyright © 2021-2023 CodeTheory Ltd"
ProductName = "umg"
ProductVersion = "{version}"
OriginalFilename = "umg.exe"


[win64]

love_binaries = "build/love/win64"

shared_libraries = [
	"build/dlls/win64/luasteam.dll",
	"build/dlls/win64/steam_api64.dll",
	"build/dlls/win64/steam_api64.lib"
]



[win32]
# Oli: Change this. You'll want to point to `build/`
love_binaries = "build/love/win32"

shared_libraries = [
	"build/dlls/win32/luasteam.dll",
	"build/dlls/win32/steam_api.dll",
	"build/dlls/win32/steam_api.lib"
]

artifacts = "archive"







